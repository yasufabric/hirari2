<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FFF9E9" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
    <title>マッスルひらり</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="game"></canvas>
      <div id="hud" hidden>
        <div class="hud-scores">
          <span id="score-tick" hidden></span>
          <div class="scores">
            <span id="score">0</span>
            <span id="combo" hidden></span>
            <span id="best-wrap">いちばん <span id="best">0</span></span>
          </div>
        </div>
      </div>
      <p id="hint" hidden aria-live="polite">
        <span class="hint-arrow hint-arrow-l" aria-hidden="true">◀</span>
        <span>タップかスワイプで移動</span>
        <span class="hint-arrow hint-arrow-r" aria-hidden="true">▶</span>
      </p>
      <section id="ready">
        <div class="card">
          <p class="kicker">夜のプロテイン棚</p>
          <h1>マッスルひらり</h1>
          <ul class="howto">
            <li>
              <svg class="howto-icon" viewBox="0 0 24 28" aria-hidden="true">
                <rect x="6" y="2" width="12" height="6" rx="2" fill="#3BA845" stroke="#1C1A18" stroke-width="2" />
                <rect x="3" y="7" width="18" height="19" rx="5" fill="#1F6FE0" stroke="#1C1A18" stroke-width="2.2" />
                <rect x="4" y="10" width="16" height="2" fill="#3BA845" />
                <circle cx="12" cy="17.5" r="3.2" fill="#FFFFFF" />
              </svg>
              <span>プロテインを取って</span>
            </li>
            <li>
              <svg class="howto-icon" viewBox="0 0 28 28" aria-hidden="true">
                <path d="M14 2.5 25.5 14 14 25.5 2.5 14Z" fill="#FF2D14" stroke="#1C1A18" stroke-width="2.4" stroke-linejoin="round" />
                <circle cx="10.5" cy="14" r="2.3" fill="#FFFFFF" stroke="#1C1A18" stroke-width="1" />
                <circle cx="17.5" cy="14" r="2.3" fill="#FFFFFF" stroke="#1C1A18" stroke-width="1" />
                <path d="M8 9.5 12.5 11.5M20 9.5 15.5 11.5M11.5 19.5Q14 17 16.5 19.5" fill="none" stroke="#1C1A18" stroke-width="1.8" stroke-linecap="round" />
              </svg>
              <span>赤い添加物をよけろ！</span>
            </li>
          </ul>
          <p class="howto-sub">ギリギリでよけると「ひらり」</p>
          <button type="button" id="start">はじめる</button>
        </div>
      </section>
      <section id="over" hidden>
        <div class="card">
          <p class="kicker" id="over-rank"></p>
          <h1>やられた</h1>
          <p id="over-best" class="best-badge" hidden>自己ベスト更新！</p>
          <p id="over-score"></p>
          <p id="over-hirari" class="lede"></p>
          <button type="button" id="restart">もういちど</button>
          <a
            id="share-x"
            class="share-x"
            href="https://x.com/intent/post"
            target="_blank"
            rel="noopener noreferrer"
          >スコアをXでシェア</a>
        </div>
      </section>
      <section id="paused" hidden>
        <div class="card">
          <p class="kicker">ちょっと休憩</p>
          <h1>ポーズ</h1>
          <button type="button" id="resume">つづける</button>
        </div>
      </section>
      <div id="corner">
        <button type="button" id="mute" aria-pressed="false" aria-label="音を消す">おと</button>
        <button type="button" id="pause" hidden aria-pressed="false" aria-label="一時停止">ポーズ</button>
      </div>
      <nav id="pads" aria-label="レーン">
        <button type="button" data-lane="0" aria-label="左レーン">左</button>
        <button type="button" data-lane="1" aria-label="真ん中">中</button>
        <button type="button" data-lane="2" aria-label="右レーン">右</button>
      </nav>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
