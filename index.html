<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#3B2416" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon.svg" />
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
    <title>マッスルひらり</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="game"></canvas>
      <div id="hud" hidden>
        <div class="muscle">
          <span class="muscle-label">ムキムキ</span>
          <div class="muscle-track" aria-hidden="true">
            <div id="muscle-fill"></div>
          </div>
        </div>
        <div class="scores">
          <span id="score">0</span>
          <span id="combo" hidden></span>
          <span id="best-wrap">いちばん <span id="best">0</span></span>
        </div>
      </div>
      <p id="hint" hidden>レーンをタップ</p>
      <section id="ready">
        <p class="kicker">夜のプロテイン棚</p>
        <h1>マッスルひらり</h1>
        <p class="lede">黄色いダイヤは添加物。缶はプロテイン。レーンをタップしてかわす。隣をかわすとひらり。</p>
        <button type="button" id="start">はじめる</button>
      </section>
      <section id="over" hidden>
        <p class="kicker" id="over-rank"></p>
        <h1>やられた</h1>
        <p id="over-score"></p>
        <p id="over-hirari" class="lede"></p>
        <button type="button" id="restart">もういちど</button>
      </section>
      <button type="button" id="mute" aria-pressed="false" aria-label="音を消す">おと</button>
      <nav id="pads" aria-label="レーン">
        <button type="button" data-lane="0" aria-label="左レーン">左</button>
        <button type="button" data-lane="1" aria-label="真ん中">中</button>
        <button type="button" data-lane="2" aria-label="右レーン">右</button>
      </nav>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
